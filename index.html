function renderProducts(){document.getElementById('grid').innerHTML=products.map((p,i)=>`<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}"></div><div class="body"><h2>${p.name}</h2><div class="meta">Art.nr. ${p.material} <span class="badge">${p.type}</span></div><div class="price">${fmt(p.price)}</div><div class="row"><div><label>Størrelse</label><select id="s${i}">${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Antall</label><input id="q${i}" type="number" min="1" max="99" value="1"></div></div><label>Kommentar</label><textarea id="c${i}" placeholder="Valgfritt"></textarea><label class="check"><input id="w${i}" type="checkbox"> Webstep</label><button class="add" onclick="add(${i})">Legg i handlekurv</button></div></article>`).join('')}
function add(i){let p=products[i],q=Math.max(1,parseInt(document.getElementById('q'+i).value)||1);let productName=[p.brand,p.model].filter(Boolean).join(' ');cart.push({item:productName,material:p.material,size:document.getElementById('s'+i).value,quantity:q,price:p.price,webstep:document.getElementById('w'+i).checked?'Ja':'Nei',comment:document.getElementById('c'+i).value.trim()});renderCart()}
function renderCart(){let box=document.getElementById('cart');if(!cart.length){box.innerHTML='<div class="empty">Handlekurven er tom.</div>'}else box.innerHTML=cart.map((x,i)=>`<div class="item"><div class="itemTop"><strong>${x.item}</strong><button class="remove" onclick="removeItem(${i})">Fjern</button></div><div>${x.size} · ${x.quantity} stk · ${fmt(x.price*x.quantity)}</div><div style="font-size:12px;color:#6b7280">Webstep: ${x.webstep}${x.comment?' · '+esc(x.comment):''}</div></div>`).join('');let qty=cart.reduce((a,x)=>a+x.quantity,0),tot=cart.reduce((a,x)=>a+x.price*x.quantity,0);document.getElementById('count').textContent=qty;document.getElementById('headerTotal').textContent=fmt(tot);document.getElementById('grand').textContent=fmt(tot)}
function removeItem(i){cart.splice(i,1);renderCart()} function toggleCart(x){document.getElementById('drawer').classList.toggle('open',x)} function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function submitOrder(){let name=document.getElementById('name').value.trim(),st=document.getElementById('status'),btn=document.getElementById('submit');if(!name){st.textContent='Skriv inn navn.';return}if(!cart.length){st.textContent='Handlekurven er tom.';return}btn.disabled=true;st.textContent='Sender bestilling…';let payload={name,cartItems:cart.map(x=>({item:x.item,material:x.material,size:x.size,quantity:x.quantity,sum:x.price*x.quantity,webstep:x.webstep,comment:x.comment}))};try{await fetch(APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});st.textContent='Bestillingen er sendt.';cart=[];renderCart();document.getElementById('name').value=''}catch(e){st.textContent='Kunne ikke sende bestillingen. Prøv igjen.'}finally{btn.disabled=false}}
renderProducts();renderCart();</script></body></html>
