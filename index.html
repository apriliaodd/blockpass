<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Merch Bestilling</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h1, h2 { color: #111; margin-top: 0; }
        p.subtitle { color: #666; margin-top: -10px; margin-bottom: 30px; font-size: 16px; }
        
        /* Grid-oppsett for produkter */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e1e4e8; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-2px); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; background-color: #f0f2f5; }
        .product-info { margin: 12px 0; }
        .product-name { font-weight: bold; font-size: 18px; margin-bottom: 4px; color: #1f2328; }
        .product-price { color: #007bff; font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        
        /* Skjema og handlekurv */
        .checkout-container { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media (max-width: 680px) { .checkout-container { grid-template-columns: 1fr; } }
        
        .cart-section, .user-info { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; height: fit-content; }
        select, input, textarea, button { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        textarea { resize: vertical; height: 80px; font-family: inherit; }
        select:focus, input:focus, textarea:focus { outline: 2px solid #007bff; outline-offset: -1px; }
        
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; transition: background 0.2s; padding: 12px; }
        button:hover { background-color: #0056b3; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eaeef2; font-size: 14px; }
        .cart-total { font-weight: bold; font-size: 18px; text-align: right; margin-top: 15px; padding-top: 10px; border-top: 2px solid #eaeef2; color: #1f2328; }
        
        #submitBtn { background-color: #2da44e; margin-top: 15px; }
        #submitBtn:hover { background-color: #2c974b; }
        .remove-btn { color: #cf222e; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 4px; display: inline-block; }
        .remove-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Team Merch Bestilling</h1>
    <p class="subtitle">Velg produkter, oppgi dine detaljer og send inn bestillingen til felleslisten.</p>
    
    <!-- Viser alle produktene med eksterne bilder -->
    <h2>Velg produkter</h2>
    <div class="products-grid" id="productsGrid"></div>

    <div class="checkout-container">
        <!-- Handlekurv -->
        <div class="cart-section">
            <h2>Din handlekurv</h2>
            <div id="cartItems">Kurven er tom.</div>
            <div class="cart-total" id="cartTotal" style="display: none;">Total: 0 kr</div>
        </div>

        <!-- Personalia -->
        <div class="user-info">
            <h2>Dine detaljer</h2>
            <label for="userName">Navn *</label>
            <input type="text" id="userName" placeholder="Ditt fulle navn" required>

            <label for="webstep">Webstep-avdeling</label>
            <input type="text" id="webstep" placeholder="f.eks. Bergen, Oslo, Trondheim...">

            <label for="comment">Kommentar</label>
            <textarea id="comment" placeholder="Evt. spesielle ønsker, størrelsesdetaljer osv..."></textarea>
            
            <button id="submitBtn" onclick="submitOrder()" style="display:none;">Send inn bestilling</button>
        </div>
    </div>

    <script>
        // Koblingen til ditt Google-ark
        const scriptUrl = 'https://google.com'; 

        // PRODUKTLISTE: Generiske bilder hentet direkte fra Unsplash som fungerer med en gang!
        const products = [
            { id: 1, name: "Hettegenser", price: 499, image: "https://unsplash.com" },
            { id: 2, name: "T-skjorte", price: 199, image: "https://unsplash.com" },
            { id: 3, name: "Caps", price: 149, image: "https://unsplash.com" }
        ];

        let cart = [];

        // Generer produktkortene på siden automatisk
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co'">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price} kr</div>
                        
                        <label style="font-size:12px; color:#555; font-weight:bold;">Størrelse:</label>
                        <select id="size-${p.id}">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                        
                        <label style="font-size:12px; color:#555; font-weight:bold;">Antall:</label>
                        <input type="number" id="qty-${p.id}" value="1" min="1">
                    </div>
                    <button onclick="addToCart(${p.id})">Legg i kurv</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const size = document.getElementById(`size-${productId}`).value;
            const quantity = parseInt(document.getElementById(`qty-${productId}`).value);

            if (quantity < 1 || isNaN(quantity)) return;

            const existing = cart.find(i => i.id === productId && i.size === size);
            if (existing) {
                existing.quantity += quantity;
                existing.rowSum = existing.quantity * product.price;
            } else {
                cart.push({
                    id: product.id,
                    item: product.name,
                    price: product.price,
                    size: size,
                    quantity: quantity,
                    rowSum: quantity * product.price
                });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalContainer = document.getElementById('cartTotal');
            const submitBtn = document.getElementById('submitBtn');
            
            if (cart.length === 0) {
                container.innerHTML = 'Kurven er tom.';
                totalContainer.style.display = 'none';
                submitBtn.style.display = 'none';
                return;
            }

            container.innerHTML = cart.map((i, index) => `
                <div class="cart-item">
                    <div>
                        <strong>${i.item}</strong> (${i.size})<br>
                        ${i.quantity} stk x ${i.price} kr
                    </div>
                    <div style="text-align: right;">
                        <div><strong>${i.rowSum} kr</strong></div>
                        <span class="remove-btn" onclick="removeItem(${index})">Fjern</span>
                    </div>
                </div>
            `).join('');

            const totalSum = cart.reduce((sum, item) => sum + item.rowSum, 0);
            totalContainer.innerHTML = `Total: ${totalSum} kr`;
            
            totalContainer.style.display = 'block';
            submitBtn.style.display = 'block';
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function submitOrder() {
            const name = document.getElementById('userName').value.trim();
            const webstep = document.getElementById('webstep').value.trim();
            const comment = document.getElementById('comment').value.trim();

            if (!name) {
                alert('Vennligst skriv inn navnet ditt.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sender bestilling...';

            const payload = {
                name: name,
                webstep: webstep,
                comment: comment,
                cartItems: cart
            };

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
