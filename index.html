<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Merch Bestilling</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h1, h2 { color: #111; margin-top: 0; }
        p.subtitle { color: #666; margin-top: -10px; margin-bottom: 30px; font-size: 16px; }
        
        /* Grid-oppsett for produkter */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e1e4e8; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-2px); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; background-color: #f0f2f5; }
        .product-info { margin: 12px 0; }
        .product-name { font-weight: bold; font-size: 18px; margin-bottom: 4px; color: #1f2328; }
        .product-price { color: #007bff; font-weight: 600; font-size: 16px; margin-bottom: 12px; }
        
        /* Skjema og handlekurv */
        .checkout-container { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media (max-width: 680px) { .checkout-container { grid-template-columns: 1fr; } }
        
        .cart-section, .user-info { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; height: fit-content; }
        select, input, textarea, button { width: 100%; padding: 8px; margin: 4px 0 10px 0; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 50px; font-family: inherit; }
        
        /* Avhukningsboks stil */
        .checkbox-container { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px 0; font-size: 14px; }
        .checkbox-container input { width: auto; margin: 0; cursor: pointer; }
        
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; transition: background 0.2s; padding: 12px; font-size: 15px; }
        button:hover { background-color: #0056b3; }
        
        .cart-item { padding: 12px 0; border-bottom: 1px solid #eaeef2; font-size: 14px; }
        .cart-item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .cart-item-details { color: #555; font-size: 13px; margin-top: 4px; background: #f8f9fa; padding: 6px; border-radius: 4px; }
        .cart-total { font-weight: bold; font-size: 18px; text-align: right; margin-top: 15px; padding-top: 10px; border-top: 2px solid #eaeef2; color: #1f2328; }
        
        #submitBtn { background-color: #2da44e; margin-top: 15px; }
        #submitBtn:hover { background-color: #2c974b; }
        .remove-btn { color: #cf222e; cursor: pointer; font-weight: bold; font-size: 13px; }
        .remove-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Team Merch Bestilling</h1>
    <p class="subtitle">Velg produkter og spesifiser detaljer for hvert enkelt plagg.</p>
    
    <h2>Velg produkter</h2>
    <div class="products-grid" id="productsGrid">Laster produkter...</div>

    <div class="checkout-container">
        <!-- Handlekurv -->
        <div class="cart-section">
            <h2>Din handlekurv</h2>
            <div id="cartItems">Kurven er tom.</div>
            <div class="cart-total" id="cartTotal" style="display: none;">Total: 0 kr</div>
        </div>

        <!-- Innsending -->
        <div class="user-info">
            <h2>Dine detaljer</h2>
            <label for="userName">Navn *</label>
            <input type="text" id="userName" placeholder="Ditt fulle navn" required>
            
            <button id="submitBtn" onclick="submitOrder()" style="display:none;">Send inn bestilling</button>
        </div>
    </div>

    <script>
        const scriptUrl = 'https://google.com'; 

        const products = [
            { id: 1, name: "Hettegenser", price: 499, image: "https://unsplash.com" },
            { id: 2, name: "T-skjorte", price: 199, image: "https://unsplash.com" },
            { id: 3, name: "Caps", price: 149, image: "https://unsplash.com" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co'">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price} kr</div>
                        
                        <label style="font-size:12px; color:#555; font-weight:bold;">Størrelse:</label>
                        <select id="size-${p.id}">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                        
                        <label style="font-size:12px; color:#555; font-weight:bold;">Antall:</label>
                        <input type="number" id="qty-${p.id}" value="1" min="1">

                        <div class="checkbox-container">
                            <input type="checkbox" id="webstep-${p.id}">
                            <label for="webstep-${p.id}">Webstep (Ja/Nei)</label>
                        </div>

                        <label style="font-size:12px; color:#555; font-weight:bold;">Kommentar:</label>
                        <textarea id="comment-${p.id}" placeholder="Spesielle ønsker for dette plagget..."></textarea>
                    </div>
                    <button onclick="addToCart(${p.id})">Legg i kurv</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const size = document.getElementById(`size-${productId}`).value;
            const quantity = parseInt(document.getElementById(`qty-${productId}`).value);
            const isWebstepChecked = document.getElementById(`webstep-${productId}`).checked;
            const webstepValue = isWebstepChecked ? "Ja" : "Nei";
            const comment = document.getElementById(`comment-${productId}`).value.trim();

            if (quantity < 1 || isNaN(quantity)) return;

            const existing = cart.find(i => i.id === productId && i.size === size && i.webstep === webstepValue && i.comment === comment);
            
            if (existing) {
                existing.quantity += quantity;
                existing.rowSum = existing.quantity * product.price;
            } else {
                cart.push({
                    id: product.id,
                    item: product.name,
                    price: product.price,
                    size: size,
                    quantity: quantity,
                    webstep: webstepValue,
                    comment: comment,
                    rowSum: quantity * product.price
                });
            }

            document.getElementById(`comment-${productId}`).value = '';
            document.getElementById(`webstep-${productId}`).checked = false;

            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalContainer = document.getElementById('cartTotal');
            const submitBtn = document.getElementById('submitBtn');
            
            if (cart.length === 0) {
                container.innerHTML = 'Kurven er tom.';
                totalContainer.style.display = 'none';
                submitBtn.style.display = 'none';
                return;
            }

            container.innerHTML = cart.map((i, index) => `
                <div class="cart-item">
                    <div class="cart-item-header">
                        <div>
                            <strong>${i.item}</strong> (${i.size})<br>
                            ${i.quantity} stk x ${i.price} kr
                        </div>
                        <div style="text-align: right;">
                            <div><strong>${i.rowSum} kr</strong></div>
                            <span class="remove-btn" onclick="removeItem(${index})">Fjern</span>
                        </div>
                    </div>
                    <div class="cart-item-details">
                        Webstep: <strong>${i.webstep}</strong> 
                        ${i.comment ? ` | Komm: <em>"${i.comment}"</em>` : ''}
                    </div>
                </div>
            `).join('');

            const totalSum = cart.reduce((sum, item) => sum + item.rowSum, 0);
            totalContainer.innerHTML = `Total: ${totalSum} kr`;
            
            totalContainer.style.display = 'block';
            submitBtn.style.display = 'block';
        }
